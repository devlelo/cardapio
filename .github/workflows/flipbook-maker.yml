name: Flipbook Maker build

on:
  push:
    branches:
      - feature/flipbook-maker-offline
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Dependency audit
        run: |
          npm audit --json > audit.json || true
          node -e "const a=require('./audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(name + ': ' + v.severity + ' | range=' + v.range + ' | fix=' + JSON.stringify(v.fixAvailable))"
      - run: npm run build
