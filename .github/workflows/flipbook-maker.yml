name: Flipbook Maker build

on:
  push:
    branches:
      - feature/flipbook-maker-offline
      - feature/flipbook-pdflip
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Test custom PDF links
        run: node scripts/test-pdf-links.mjs
      - run: npm run build
