name: Flipbook Maker build

on:
  push:
    branches:
      - feature/flipbook-maker-offline
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - run: npm run build
