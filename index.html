<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <title>Cardápio</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/dflip/css/dflip.min.css">
</head>
<body>
  <main id="reader" class="reader">
    <div id="loading" class="status"><span class="spinner"></span><p>A preparar o ebook…</p></div>
    <div id="error" class="status hidden">
      <h1>Não foi possível abrir este ebook</h1>
      <p id="error-message"></p>
    </div>
    <div id="empty" class="status hidden">
      <h1>Cardápio</h1>
      <p>Adiciona o endereço do teu PDF no ficheiro <code>books.js</code> e abre o link correspondente.</p>
    </div>
    <section id="book-shell" class="book-shell hidden">
      <div class="_df_book" id="book_pdf"></div>
    </section>
  </main>

  <script src="/books.js"></script>
  <script src="/app.js"></script>
  <script src="/dflip/js/libs/jquery.min.js"></script>
  <script src="/dflip/js/dflip.min.js"></script>
</body>
</html>
