<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101318">
  <meta name="description" content="Leitor de catálogo em formato flipbook.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./sdflip.min.css">
  <title>Catálogo digital</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#101318;color:#e9edf3;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    body{min-height:100dvh}.reader-shell{min-height:100dvh;display:grid;place-items:center;padding:24px}.reader-message{width:min(100%,420px);text-align:center}.reader-message h1{font-size:22px;letter-spacing:-.5px;margin:0 0 8px}.reader-message p{font-size:13px;color:#aab4c1;line-height:1.65}.reader-status{font-size:12px;color:#aab4c1;min-height:20px}.upload-panel{margin-top:18px;padding:20px;border:1px dashed #4b5869;border-radius:14px;background:#1a202a}.upload-panel[hidden]{display:none}.file-button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:9px;background:#d8e6ff;color:#152033;font-weight:700;font-size:13px;cursor:pointer}.file-button input{position:absolute;width:1px;height:1px;opacity:0}.hint{font-size:11px!important;color:#7f8a99!important;margin-top:14px}
    @media(max-width:600px){.reader-shell{padding:14px}.reader-message h1{font-size:19px}}
  </style>
</head>
<body>
  <main class="reader-shell">
    <section class="reader-message">
      <h1>Catálogo digital</h1>
      <p id="readerStatus" class="reader-status" role="status" aria-live="polite">A iniciar o leitor…</p>
      <div id="uploadPanel" class="upload-panel" hidden>
        <label class="file-button">Seleccionar PDF<input id="pdfFile" type="file" accept="application/pdf,.pdf"></label>
        <p class="hint">O documento é processado no teu dispositivo. Não é enviado para nenhum servidor.</p>
      </div>
    </section>
  </main>
  <script type="module" src="./reader.js"></script>
</body>
</html>
