<!doctype html>
<html lang="pt" data-pdflip-auto="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111713">
  <meta name="description" content="Leitor de catálogo com páginas realistas, links e navegação por toque.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./pdflip/pdflip.css">
  <title>Catálogo digital</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111713;color:#f4f6f2;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    body{height:100dvh}
    .reader-shell{height:100dvh;width:100vw;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 42%,#26332a 0,#171f19 48%,#0e130f 100%)}
    .reader-topbar{height:46px;flex:0 0 46px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;border-bottom:1px solid #ffffff12;background:#0b100dcc;z-index:5}
    .reader-brand{display:flex;align-items:center;gap:9px;color:#e9f1e9;text-decoration:none;font-size:11px;font-weight:800;letter-spacing:1.1px}
    .reader-brand-mark{width:23px;height:23px;display:grid;place-items:center;border-radius:6px;background:#b9ed8b;color:#172315;font-size:13px}
    .reader-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c2cec3;font-size:11px;text-align:right}
    .reader-stage{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:10px 14px 14px;overflow:hidden}
    .book-host{width:min(100%,1500px);height:100%;min-height:0;margin:auto;--pdflip-accent:#b9ed8b;--pdflip-toolbar-background:#111a13;--pdflip-page-shadow:0 8px 34px #0008;--pdflip-button-size:2.6rem}
    .book-host.pdflip{width:100%;height:100%;max-height:100%;background:transparent}
    .reader-status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;max-width:calc(100% - 32px);padding:12px 16px;border:1px solid #ffffff20;border-radius:10px;background:#101812ed;color:#dbe6dc;font-size:12px;text-align:center;box-shadow:0 12px 40px #0007}
    .reader-status[hidden]{display:none}
    .upload-panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;width:min(390px,calc(100% - 28px));padding:22px;border:1px solid #ffffff24;border-radius:14px;background:#17221a;color:#edf4ed;text-align:center;box-shadow:0 20px 70px #0009}
    .upload-panel[hidden]{display:none}
    .upload-panel p{font-size:12px;line-height:1.6;color:#aab8ac}
    .file-button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:8px;background:#b9ed8b;color:#172315;font-size:12px;font-weight:800;cursor:pointer}
    .file-button input{position:absolute;width:1px;height:1px;opacity:0}
    @media(max-width:600px){.reader-topbar{height:38px;flex-basis:38px;padding:0 11px}.reader-brand{font-size:9px}.reader-brand-mark{width:20px;height:20px}.reader-title{font-size:10px}.reader-stage{padding:2px 0 0}.book-host{width:100%;height:100%;max-height:none}.book-host.pdflip{width:100%;height:100%}}
    @media(orientation:landscape) and (max-height:500px){.reader-topbar{height:32px;flex-basis:32px}.reader-stage{padding:0}}
  </style>
</head>
<body>
  <main class="reader-shell">
    <header class="reader-topbar">
      <a class="reader-brand" href="../" aria-label="Voltar ao Cardápio"><span class="reader-brand-mark">C</span><span>CATÁLOGO DIGITAL</span></a>
      <span id="readerTitle" class="reader-title">A preparar o livro…</span>
    </header>
    <section class="reader-stage">
      <div id="book" class="book-host" aria-label="Livro digital"></div>
      <p id="readerStatus" class="reader-status" role="status" aria-live="polite">A preparar o leitor…</p>
      <div id="uploadPanel" class="upload-panel" hidden>
        <strong>Não foi possível abrir o catálogo.</strong>
        <p id="uploadMessage">Selecciona novamente o PDF para continuar.</p>
        <label class="file-button">Seleccionar PDF<input id="pdfFile" type="file" accept="application/pdf,.pdf"></label>
      </div>
    </section>
  </main>
  <script type="module" src="./reader.js"></script>
</body>
</html>
